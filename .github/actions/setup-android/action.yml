name: Set up Android build
description: JDK 17 (Temurin), Gradle with caching, and an executable gradlew.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew
